name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create dummy .env
      run: echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env

    - name: Install dependencies
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate || echo "Prisma generate failed, continuing..."

    - name: Check TypeScript types
      run: npx tsc --noEmit || echo "TypeScript check failed, continuing with build..."

    - name: Build web app
      run: npm run build

    - name: Verify dist folder
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist folder not found"
          exit 1
        fi
        echo "dist folder contents:"
        ls -la dist/

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK with Gradle
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Verify APK was created
      run: |
        if [ -f "android/app/build/outputs/apk/debug/TarifaZero.apk" ]; then
          echo "✅ APK created successfully!"
          ls -lh android/app/build/outputs/apk/debug/TarifaZero.apk
        else
          echo "❌ APK not found!"
          echo "Checking for any APK files:"
          find android/app/build/outputs/apk -name "*.apk" || echo "No APK files found"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: tarifazero-debug-apk
        path: android/app/build/outputs/apk/debug/TarifaZero.apk
        retention-days: 30

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          android/app/build/outputs/logs/
          npm-debug.log
          *.log
        retention-days: 7
        if-no-files-found: ignore
