name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Export JAVA_HOME
      run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

    - name: Create dummy .env
      run: echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env

    - name: Install dependencies
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate || echo "Prisma generate failed, continuing..."

    - name: Check TypeScript types
      run: npx tsc --noEmit || echo "TypeScript check failed, continuing with build..."

    - name: Debug - Show environment
      run: |
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Working directory: $(pwd)"
        echo "Files in root:"
        ls -la
        echo "Package.json scripts:"
        cat package.json | grep -A 10 '"scripts"'

    - name: Build web app
      run: npm run build
      env:
        NODE_ENV: production
        CI: true

    - name: Verify dist folder
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist folder not found"
          exit 1
        fi
        echo "dist folder contents:"
        ls -la dist/

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Verify Capacitor sync
      run: |
        echo "Checking Android project structure..."
        if [ ! -d "android/app/src/main/assets/public" ]; then
          echo "❌ Capacitor sync failed - public assets not found!"
          exit 1
        fi
        echo "✅ Capacitor sync successful"
        echo "Assets folder contents:"
        ls -la android/app/src/main/assets/public/ | head -20

    # ========== CONFIGURAÇÃO DE ASSINATURA (Se secrets existirem) ==========
    - name: Create Keystore from Secrets
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      run: |
        echo "🔐 Configurando assinatura do APK..."
        echo ${{ secrets.ANDROID_KEYSTORE_BASE64 }} | base64 --decode > android/app/release-key.jks
        echo "storeFile=release-key.jks" >> android/gradle.properties
        echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/gradle.properties
        echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" >> android/gradle.properties
        echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/gradle.properties
        echo "✅ Keystore configurado com sucesso!"

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    # ========== BUILD RELEASE (Se keystore existir) ==========
    - name: Build Release APK with Gradle
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      working-directory: android
      run: |
        echo "🚀 Iniciando build RELEASE assinado..."
        ./gradlew assembleRelease --no-daemon --stacktrace
        echo "✅ Build RELEASE concluído!"

    # ========== BUILD DEBUG (Fallback se não houver keystore) ==========
    - name: Build Debug APK with Gradle
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
      working-directory: android
      run: |
        echo "⚠️ Nenhum keystore encontrado. Build DEBUG (não atualizável)..."
        ./gradlew assembleDebug --no-daemon --stacktrace
        echo "⚠️ AVISO: Este APK NÃO poderá atualizar versões anteriores!"

    # ========== VERIFICAÇÃO E UPLOAD ==========
    - name: Verify APK was created (Release)
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      run: |
        if [ -f "android/app/build/outputs/apk/release/TarifaZero-*.apk" ]; then
          echo "✅ APK Release criado com sucesso!"
          ls -lh android/app/build/outputs/apk/release/TarifaZero-*.apk
        else
          echo "❌ APK Release não encontrado!"
          find android/app/build/outputs/apk -name "*.apk" || echo "Nenhum APK encontrado"
          exit 1
        fi

    - name: Verify APK was created (Debug)
      if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
      run: |
        if [ -f "android/app/build/outputs/apk/debug/TarifaZero-*.apk" ]; then
          echo "✅ APK Debug criado (limitado)!"
          ls -lh android/app/build/outputs/apk/debug/TarifaZero-*.apk
        else
          echo "❌ APK Debug não encontrado!"
          find android/app/build/outputs/apk -name "*.apk" || echo "Nenhum APK encontrado"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: TarifaZero-${{ github.run_number }}${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '-release' || '-debug' }}
        path: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        compression-level: 0

    - name: Get version from build.gradle
      id: get_version
      run: |
        VERSION=$(grep "versionName" android/app/build.gradle | awk -F'"' '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    # ========== RELEASE AUTOMÁTICO (Tags ou Main) ==========
    - name: Create Release (Tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/release/*.apk
        tag_name: ${{ github.ref_name }}
        name: TarifaZero ${{ github.ref_name }}
        body: |
          ## 🚀 Lançamento Oficial ${{ github.ref_name }}
          
          **Versão:** ${{ steps.get_version.outputs.version }}
          **Commit:** ${{ github.sha }}
          
          ### ✅ APK Assinado
          Este APK foi assinado com o keystore oficial e pode atualizar versões anteriores.
          
          ### 📦 Instalação
          1. Baixe o APK abaixo
          2. Instale no seu dispositivo Android
          3. Atualize diretamente pelo app quando disponível
          
          ---
          Build gerado automaticamente pelo GitHub Actions
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Release (Main Push)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/debug/*.apk
        tag_name: v${{ steps.get_version.outputs.version }}-build${{ github.run_number }}
        name: TarifaZero v${{ steps.get_version.outputs.version }} (Build ${{ github.run_number }})
        body: |
          ## 🚀 Build Automático #${{ github.run_number }}
          
          **Versão:** ${{ steps.get_version.outputs.version }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ### 📦 Download
          Baixe o APK abaixo e instale no seu dispositivo Android.
          
          ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '### ✅ APK Assinado' || '### ⚠️ APK Debug (não atualizável)' }}
          ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'Este APK foi assinado e pode atualizar versões anteriores.' || 'Este APK é unsigned e NÃO poderá atualizar versões instaladas. Configure as secrets para build release.' }}
          
          ### 🔄 Changelog
          ${{ github.event.head_commit.message }}
          
          ---
          Build gerado automaticamente pelo GitHub Actions
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          android/app/build/outputs/logs/
          npm-debug.log
          *.log
        retention-days: 7
        if-no-files-found: ignore
